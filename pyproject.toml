[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ckd-launch-intelligence"
version = "0.1.0"
description = "Public-data CKD launch intelligence portfolio project"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "ruff>=0.7,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ckd_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
